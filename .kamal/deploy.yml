# Kamal deploy of everything AwaitIO runs: the static site (awaitio.com) and the demo
# (demo.awaitio.com), both from one image (.kamal/Dockerfile) on one Droplet.
#
# Deployed by hand on the deploying machine, from a clean main (see .claude/guidelines/deploy.md):
#
#   kamal deploy -c .kamal/deploy.yml              # everything
#   kamal deploy -c .kamal/deploy.yml -r demo      # one role only
#
# The image is built on the Droplet (remote builder) and pushed to the registry running there, so it
# never leaves the server; the deploying machine only sends the build context.
service: awaitio

image: awaitio

servers:
  site:
    hosts:
      - 168.144.4.121
    cmd: nginx -g "daemon off;"
    proxy:
      # www only redirects to the bare domain (.kamal/nginx.conf)
      hosts:
        - awaitio.com
        - www.awaitio.com
      ssl: true
      app_port: 8080
      healthcheck:
        path: /
  # One container only: runs live in the memory of the process.
  demo:
    hosts:
      - 168.144.4.121
    cmd: node dist/server.js
    env:
      clear:
        HOST: 0.0.0.0
        PORT: "8080"
      secret:
        - SESSION_SECRET
    proxy:
      host: demo.awaitio.com
      ssl: true
      app_port: 8080
      healthcheck:
        path: /health

primary_role: site

ssh:
  user: root

registry:
  # Runs on the Droplet itself (kamal-registry container behind kamal-proxy)
  server: registry.kamal.homoky.cz
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://root@168.144.4.121
  local: false
  context: .
  dockerfile: .kamal/Dockerfile

env:
  clear:
    NODE_ENV: production
