# nginx for the site role of .kamal/deploy.yml, running as the unprivileged `node` user: it listens
# on 8080 and keeps its pid and temp files in /tmp. Serves the export copied to /srv/site.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # kamal-proxy terminates TLS and passes the original Host on
  server {
    listen 8080;
    server_name www.awaitio.com;
    return 301 https://awaitio.com$request_uri;
  }

  server {
    listen 8080 default_server;
    root /srv/site;

    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages are exported as <path>/index.html (trailingSlash)
    location / {
      try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
  }
}
